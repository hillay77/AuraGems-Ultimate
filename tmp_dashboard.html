<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><style>.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:#f6f3ec}.side{background:#080808;color:#fff;padding:35px 25px}.side button{display:block;width:100%;padding:13px;background:none;border:0;color:#fff;text-align:left}.main{padding:45px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat,.panel{background:#fff;padding:22px}.panel{margin-top:22px;overflow:auto}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #eee;text-align:left}dialog{border:0;width:min(600px,94%);padding:30px}@media(max-width:800px){.shell{display:block}.stats{grid-template-columns:repeat(2,1fr)}}</style><title>Aura Admin</title></head><body><div class="shell"><aside class="side"><h2><span class="gold">Aura</span> Admin</h2><button onclick="products()">Products & Inventory</button><button onclick="orders()">Orders</button><button onclick="customers()">Customers</button><button onclick="subscribers()">Newsletter</button><button onclick="logout()">Sign out</button></aside><main class="main"><p class="eyebrow">Control Center</p><h1>Sales Dashboard</h1><div id="stats" class="stats"></div><section id="panel" class="panel"></section></main></div><dialog id="dlg"><form onsubmit="saveProduct(event)"><h2>Product</h2><input type="hidden" name="id"><input type="hidden" name="image"><label class="field">Image<input type="file" name="file" accept="image/jpeg,image/png,image/webp"></label><label class="field">Name<input name="name" required></label><label class="field">Category<select name="category"></select></label><label class="field">Price<input name="price" type="number" required></label><label class="field">Old price<input name="oldPrice" type="number"></label><label class="field">Stock<input name="stock" type="number" required></label><label class="field">Badge<input name="badge"></label><label class="field">Description<textarea name="description"></textarea></label><button class="btn">Save</button><button type="button" onclick="dlg.close()">Cancel</button></form></dialog><script src="/admin-inject.js"></script><script src="/admin.js"></script></body></html>
