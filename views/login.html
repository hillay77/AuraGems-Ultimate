<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Admin Login</title></head><body style="min-height:100vh;display:grid;place-items:center;background:#080808"><main style="background:white;padding:45px;width:min(430px,92vw);border-top:4px solid #d4af37"><h1>Aura Admin</h1><form id="f"><label class="field">Email<input name="email" type="email" required></label><label class="field">Password<input name="password" type="password" required></label><p id="err" style="color:#a00"></p><button class="btn">Secure Sign In</button></form></main><script>f.onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),x=await r.json();r.ok?location.replace('/admin/dashboard'):err.textContent=x.error}</script></body></html>
